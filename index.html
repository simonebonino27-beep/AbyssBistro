<title>Abyss Bistro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Abyss Bistro: tower defense roguelike in un sushi bar in fondo all'oceano.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen portrait game. HUD strip, murky abyss playfield, kitchen bar at the bottom. Comic ink outlines everywhere. */
:root{
  --ink:#0a0507; --abyss:#0b1a1c; --deep:#14292b; --tide:#21423f; --foam:#f0e9d4; --mist:#a8bcb2;
  --coral:#ff6a3d; --coral-ink:#2a0b03; --pearl:#f1dca2; --danger:#ff4f5e; --toxic:#b8e04a; --veil:rgba(6,14,15,.9); --glass:rgba(8,18,19,.74);
  --r-comune:#d9c08f; --r-noncomune:#6fc27a; --r-raro:#46aee8; --r-epico:#ff7a59; --r-leggendario:#f2c94c;
  --display:"Bangers","Impact","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--abyss);color:var(--foam);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;position:relative;overflow:hidden}
.gut{box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--pearl);outline-offset:2px}
#hud{position:absolute;top:0;left:0;right:0;max-width:540px;margin:0 auto;padding-block:8px;display:flex;gap:6px;align-items:center;z-index:2}
.pill{display:flex;align-items:center;gap:5px;background:var(--glass);border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:1px}
.heart{width:11px;height:11px;background:var(--danger);border-radius:3px 3px 0 3px;transform:rotate(45deg) scale(.9)}
.pearl{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--pearl) 45%,#a8874a 100%);box-shadow:0 0 0 1.5px var(--ink)}
#waveLbl{flex:1;min-width:0;overflow:hidden;justify-content:center;font-family:var(--display);font-size:17px;letter-spacing:.5px;color:var(--pearl)}
.hbtn{flex:none;background:var(--tide);border:2px solid var(--ink);border-radius:10px;height:36px;min-width:38px;font-family:var(--display);font-size:19px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:3px}
.bars{width:4px;height:14px;background:var(--foam);border-radius:1px}
canvas#game{position:absolute;left:0;top:0;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:62px;z-index:3;transform:translateX(-50%);background:var(--ink);color:var(--pearl);padding:7px 14px;border-radius:10px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#panel{position:absolute;background:var(--abyss);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;width:230px;box-sizing:border-box;z-index:3}
#panel h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:1px;color:var(--pearl)}
#panel p{margin:0;font-size:12px;color:var(--mist);font-weight:600}
#panel .row{display:flex;gap:6px}
#panel .row button{flex:1;background:var(--tide);border:2px solid var(--ink);border-radius:8px;padding:8px 4px;font-size:13px}
#panel button.up{background:var(--coral);color:var(--coral-ink)}
#panel button[disabled]{opacity:.4;cursor:default}
.hire{display:flex;align-items:center;gap:8px;background:var(--deep);border:2px solid var(--ink);border-radius:8px;padding:4px 8px 4px 4px;text-align:left;font-size:13px}
.hire img{width:34px;height:34px}
.hire .grow{flex:1;display:flex;flex-direction:column;line-height:1.15}
.hire small{font-weight:600;color:var(--mist);font-size:11px}
.hire .cs{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.hire[disabled]{opacity:.45;cursor:default}
#bar{position:absolute;bottom:0;left:0;right:0;z-index:2;padding-block:22px 10px;background:linear-gradient(to bottom,transparent,var(--veil) 34%)}
#barIn{max-width:508px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
#shop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.emp{background:var(--glass);border:2px solid var(--ink);border-radius:12px;padding:3px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.emp img{width:44px;height:44px}
.emp .nm{font-size:12px;line-height:1.1}
.emp .cs{font-size:12px;display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;color:var(--pearl)}
.emp .cs .pearl{width:9px;height:9px}
.emp .rar{position:absolute;top:5px;left:6px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px var(--ink)}
.emp.sel{background:var(--tide);box-shadow:0 0 0 2px var(--pearl)}
.emp.poor{opacity:.55}
.emp.locked{opacity:.4}
.emp.locked img{filter:grayscale(1) brightness(.45)}
.emp.locked .cs{color:var(--mist);font-size:11px}
#actions{display:flex;gap:6px}
.act{background:var(--glass);border:2px solid var(--ink);border-radius:12px;padding:6px 9px;display:flex;align-items:center;gap:6px;font-size:13px}
.act img{width:28px;height:28px}
.act.sel{background:var(--tide);box-shadow:0 0 0 2px var(--pearl)}
#startBtn{flex:1;background:var(--coral);color:var(--coral-ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-size:22px;letter-spacing:1px;border-radius:12px;padding:6px;white-space:nowrap}
#startBtn:active,.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.overlay{position:absolute;inset:0;background:var(--veil);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px;box-sizing:border-box;overflow-y:auto}
.sheet{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto}
.eyebrow{margin:0;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--mist)}
.sheet h1{margin:0;font-family:var(--display);font-weight:400;font-size:58px;line-height:.9;letter-spacing:2px;color:var(--coral);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);transform:rotate(-2deg)}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:1.5px;color:var(--pearl);text-shadow:2px 2px 0 var(--ink);text-wrap:balance}
.sheet .lead{margin:0;font-size:15px;font-weight:600;color:var(--mist);line-height:1.4}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{background:var(--deep);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:14px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.mode .mn{font-family:var(--display);font-size:24px;letter-spacing:1px;color:var(--pearl);line-height:1}
.mode .md{font-size:12px;font-weight:600;color:var(--mist);line-height:1.3}
.mode .tag{align-self:flex-start;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--toxic);color:var(--ink);margin-top:3px}
.mode.soon{opacity:.55;box-shadow:none}
.mode.soon .tag{background:var(--tide);color:var(--mist)}
.mode:not(.soon):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stats{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--mist);font-variant-numeric:tabular-nums;font-weight:600}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:1px;color:var(--foam)}
.big{background:var(--coral);color:var(--coral-ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-size:26px;letter-spacing:1.5px;border-radius:14px;padding:9px}
.ghost{background:var(--deep);border:3px solid var(--ink);border-radius:14px;padding:10px;font-size:15px}
.rowbtns{display:flex;gap:8px}.rowbtns>*{flex:1}
#cardList{display:flex;flex-direction:column;gap:10px}
.card{background:var(--deep);border:3px solid var(--rc);box-shadow:0 4px 0 var(--ink);border-radius:14px;padding:11px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .ty{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mist)}
.card .chip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--rc);color:var(--ink)}
.card .cn{font-family:var(--display);font-size:25px;letter-spacing:1px;line-height:1}
.card .joke{font-size:13px;font-weight:600;font-style:italic;color:var(--mist);line-height:1.35}
.card .eff{font-size:13px;color:var(--toxic);font-variant-numeric:tabular-nums;line-height:1.35}
.vol{background:var(--deep);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.bkT{font-family:var(--display);font-size:20px;letter-spacing:1px;color:var(--pearl)}
.bkD{font-size:12px;font-weight:600;color:var(--mist);line-height:1.35}
.bkM{font-size:12px;color:var(--toxic);min-height:16px}
#saveCode{width:100%;box-sizing:border-box;background:var(--abyss);border:2px solid var(--ink);border-radius:10px;color:var(--foam);font:600 13px var(--body);padding:9px 10px;user-select:text;-webkit-user-select:text}
.vol .ghost{padding:8px;font-size:13px}
.vol label{display:grid;grid-template-columns:70px minmax(0,1fr) 38px;align-items:center;gap:10px;font-size:14px}
.vol output{text-align:right;font-variant-numeric:tabular-nums;color:var(--pearl)}
input[type=range]{width:100%;accent-color:var(--coral)}
#menuArt{width:150px;height:130px;margin:0 auto -6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <canvas id="game" aria-label="Campo di gioco: il fondale davanti al sushi bar"></canvas>
  <div id="hud" class="gut">
    <div class="pill" title="Vita del bancone"><span class="heart" aria-hidden="true"></span><b id="hpLbl">20</b></div>
    <div class="pill" title="Perle"><span class="pearl" aria-hidden="true"></span><b id="perleLbl">0</b></div>
    <div class="pill" id="waveLbl">Ondata 1/3</div>
    <button class="hbtn" id="speedBtn" aria-label="Velocità di gioco">x1</button>
    <button class="hbtn" id="pauseBtn" aria-label="Pausa"><span class="bars"></span><span class="bars"></span></button>
  </div>
  <div id="toast" role="status"></div>
  <div id="panel" hidden></div>
  <div id="bar" class="gut"><div id="barIn">
    <div id="shop"></div>
    <div id="actions">
      <button class="act" id="trapBtn"><img alt="" id="trapIco"><span>Trappole <span id="trapCnt">8</span></span></button>
      <button class="act" id="wasabiBtn" hidden><img alt="" id="wasabiIco"><span>Wasabi <span id="wasabiCnt">0</span></span></button>
      <button id="startBtn">Inizia ondata 1</button>
    </div>
  </div></div>

  <div class="overlay" id="menu">
    <div class="sheet">
      <canvas id="menuArt" width="300" height="260" aria-hidden="true"></canvas>
      <h1>Abyss Bistro</h1>
      <p class="lead">Un sushi bar in fondo all'oceano. Clienti mostruosi. Personale instabile.</p>
      <div class="modes">
        <button class="mode" id="modeShort"><span class="mn">Run corta</span><span class="md">Piano 1, 3 ondate e il Re Aragosta.</span><span class="tag">Gioca</span></button>
        <button class="mode" id="modeInf"><span class="mn">Infinita</span><span class="md">Ondate senza fine, boss ogni 5. Quanto resisti?</span><span class="tag">Gioca</span></button>
        <button class="mode soon" id="modeLong"><span class="mn">Run lunga</span><span class="md">6 piani fino al Megalodonte.</span><span class="tag">In arrivo</span></button>
        <button class="mode soon" id="modeMonster"><span class="mn">Mostro affamato</span><span class="md">Ruoli invertiti: mangia tu il bistrot.</span><span class="tag">In arrivo</span></button>
      </div>
      <div class="stats" id="menuStats"></div>
      <button class="ghost" id="settingsBtn">Volume e impostazioni</button>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="sheet">
      <h2 id="pauseTitle">Pausa</h2>
      <div class="vol">
        <label for="volMusic">Musica <input type="range" id="volMusic" min="0" max="100" step="1"><output id="volMusicOut">60</output></label>
        <label for="volSfx">Effetti <input type="range" id="volSfx" min="0" max="100" step="1"><output id="volSfxOut">80</output></label>
      </div>
      <div class="vol" id="backup">
        <span class="bkT">Salvataggio</span>
        <span class="bkD">Perle e record restano salvati su questo dispositivo. Per spostarli su un altro, copia il codice e incollalo lì.</span>
        <div class="rowbtns"><button class="ghost" id="copySave">Copia codice</button><button class="ghost" id="loadSave">Carica codice</button></div>
        <input id="saveCode" type="text" placeholder="Incolla qui il codice" autocomplete="off" spellcheck="false">
        <span class="bkM" id="saveMsg" role="status"></span>
      </div>
      <button class="big" id="resumeBtn">Riprendi</button>
      <div class="rowbtns" id="pauseRun">
        <button class="ghost" id="restartBtn">Ricomincia</button>
        <button class="ghost" id="quitBtn">Menu principale</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="cards" hidden>
    <div class="sheet">
      <p class="eyebrow" id="cardsEyebrow">Ondata superata</p>
      <h2>Scegli una carta</h2>
      <div id="cardList"></div>
    </div>
  </div>

  <div class="overlay" id="end" hidden>
    <div class="sheet">
      <p class="eyebrow" id="endEyebrow"></p>
      <h2 id="endTitle"></h2>
      <p class="lead" id="endText"></p>
      <div class="stats" id="endStats"></div>
      <button class="big" id="againBtn">Riprova</button>
      <button class="ghost" id="endMenuBtn">Menu principale</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=360,H=560,TAU=Math.PI*2,INK='#170e12';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');

/* ================= salvataggio ================= */
const KEY='abyssBistro.save.v1';
const DEF_SAVE={perle:0,runs:0,wins:0,best:0,bestInf:0,vol:{music:60,sfx:80}};
let save=JSON.parse(JSON.stringify(DEF_SAVE));
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);save=Object.assign(save,o);save.vol=Object.assign({},DEF_SAVE.vol,o.vol||{})}}catch(e){}
function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* ================= percorso e piazzole ================= */
const PATH=[[-4,70],[292,70],[292,172],[68,172],[68,282],[292,282],[292,392],[180,392],[180,486]];
const SEGS=[];let PATH_LEN=0;
for(let i=0;i<PATH.length-1;i++){const[ax,ay]=PATH[i],[bx,by]=PATH[i+1];const len=Math.hypot(bx-ax,by-ay);SEGS.push({ax,ay,bx,by,dx:(bx-ax)/len,dy:(by-ay)/len,len});PATH_LEN+=len}
function posAt(d){for(const s of SEGS){if(d<=s.len)return{x:s.ax+s.dx*d,y:s.ay+s.dy*d,dx:s.dx};d-=s.len}const s=SEGS[SEGS.length-1];return{x:s.bx,y:s.by,dx:0}}
function distSeg(px,py,s){let t=((px-s.ax)*s.dx+(py-s.ay)*s.dy);t=Math.max(0,Math.min(s.len,t));return Math.hypot(px-(s.ax+s.dx*t),py-(s.ay+s.dy*t))}
function distToPath(x,y){let m=1e9;for(const s of SEGS)m=Math.min(m,distSeg(x,y,s));return m}
const SLOTS=[[30,121],[110,121],[190,121],[255,121],[334,121],[30,227],[130,227],[210,227],[290,227],[40,337],[120,337],[200,337],[255,337],[334,337],[60,440],[128,440],[236,445],[320,440]].map(([x,y])=>({x,y,tower:null}));

/* ================= dati ================= */
const RAR={comune:{n:'Comune',c:'--r-comune',w:50},noncomune:{n:'Non comune',c:'--r-noncomune',w:30},raro:{n:'Raro',c:'--r-raro',w:14},epico:{n:'Epico',c:'--r-epico',w:5},leggendario:{n:'Leggendario',c:'--r-leggendario',w:1}};
const TOWERS={
  granchio:{name:'Granchio',full:'Granchio sushiman',cost:50,range:95,dmg:10,rate:.8,rar:'comune',info:'Lancia nigiri a distanza'},
  squalo:{name:'Squalo',full:'Squalo buttafuori',cost:70,range:58,dmg:26,rate:.85,rar:'comune',info:'Morde chi passa troppo vicino'},
  medusa:{name:'Medusa',full:'Medusa cameriera',cost:85,range:80,dmg:6,rate:1.2,rar:'noncomune',info:'Fulmina e rallenta a catena'},
  palla:{name:'Pesce palla',full:'Pesce palla lavapiatti',cost:110,range:68,dmg:32,rate:3.2,rar:'raro',info:'Esplode in aculei tutt\'intorno'}
};
const ENEMIES={
  ghiozzo:{hp:32,speed:38,reward:6,dmg:1,r:11},
  aringa:{hp:14,speed:72,reward:3,dmg:1,r:8},
  lumaca:{hp:150,speed:19,reward:16,dmg:2,r:13},
  boss:{hp:1900,speed:14,reward:120,dmg:20,r:24}
};
const isBossWave=i=>S.run==='short'?i===3:(i+1)%5===0;
function genWave(i){
  const q=[];const add=(t,n,g)=>{for(let k=0;k<n;k++)q.push([t,g])};
  if(S.run==='short'){
    if(i===0)add('ghiozzo',10,1.1);
    else if(i===1){add('ghiozzo',6,1);add('aringa',12,.35);add('ghiozzo',3,1)}
    else if(i===2){add('ghiozzo',6,.9);add('lumaca',3,2);add('aringa',10,.3);add('ghiozzo',4,.8);add('lumaca',1,1)}
    else{add('ghiozzo',5,.8);q.push(['boss',3]);add('aringa',8,.45);add('ghiozzo',6,1.2)}
    return q}
  const n=8+i*2;
  if(isBossWave(i)){add('ghiozzo',4,.8);q.push(['boss',3]);add('aringa',Math.round(n*.6),.4);add('lumaca',Math.floor(i/5),1.6);return q}
  for(let k=0;k<n;k++){const r=Math.random();const t=i>=2&&r<.12+i*.01?'lumaca':i>=1&&r<.45?'aringa':'ghiozzo';q.push([t,t==='aringa'?.35:t==='lumaca'?1.6:Math.max(.45,1-i*.04)])}
  return q}
const hpMulFor=i=>S.run==='short'?[1,1.15,1.3,1.4][i]:1+i*.2+Math.max(0,i-10)*.1;

const pct=x=>Math.round((x-1)*100);
const fmt=x=>Math.round(x*10)/10;
const lv1=k=>TOWERS[k].dmg*S.mods.dmg[k]*S.mods.all;
const CARDS=[
  {type:'Nuovo dipendente',name:'Medusa cameriera',rar:'noncomune',joke:'Ha 200 coperti da servire e zero voglia di farlo.',eff:s=>'Si aggiunge al mazzo: Medusa (85 perle), fulmina fino a 3 nemici',ok:s=>!s.unlocked.medusa,apply:s=>{s.unlocked.medusa=true}},
  {type:'Nuovo dipendente',name:'Pesce palla lavapiatti',rar:'raro',joke:'Lava piatti da 12 anni. Un altro piatto sporco e esplode.',eff:s=>'Si aggiunge al mazzo: Pesce palla (110 perle), aculei ad area',ok:s=>!s.unlocked.palla,apply:s=>{s.unlocked.palla=true}},
  {type:'Potenziamento',name:'Nigiri al wasabi',rar:'comune',joke:'Il granchio ha scoperto il wasabi. Non tornerà più quello di prima.',eff:s=>'Danno Granchio: '+fmt(lv1('granchio'))+' → '+fmt(lv1('granchio')*1.35),apply:s=>{s.mods.dmg.granchio*=1.35}},
  {type:'Potenziamento',name:'Denti limati',rar:'comune',joke:'Dal dentista ci è andato con una lima da ferro.',eff:s=>'Danno Squalo: '+fmt(lv1('squalo'))+' → '+fmt(lv1('squalo')*1.35),apply:s=>{s.mods.dmg.squalo*=1.35}},
  {type:'Potenziamento',name:'Alta tensione',rar:'noncomune',joke:'Qualcuno ha attaccato la medusa alla presa del frigo.',eff:s=>'Bersagli a catena: '+(3+s.mods.chain)+' → '+(4+s.mods.chain),ok:s=>s.unlocked.medusa,apply:s=>{s.mods.chain++}},

function showMenu(){S.mode='menu';closePanel();['end','cards','pause'].forEach(id=>$(id).hidden=true);
  const best=save.best>=5?'Boss':save.best?'Ond. '+Math.min(save.best,4):'—';
  $('menuStats').innerHTML='<div><b>'+save.perle+'</b>perle salvate</div><div><b>'+best+'</b>record corta</div><div><b>'+(save.bestInf||'—')+'</b>record infinita</div>';$('menu').hidden=false;applyVol()}
function startRun(run){S=newState(run);for(const k in cache)delete cache[k];['menu','end','cards','pause'].forEach(id=>$(id).hidden=true);applyVol();toast('Tocca una piazzola per assumere un dipendente')}
$('modeShort').onclick=()=>{sfx('click');startRun('short')};
$('modeInf').onclick=()=>{sfx('click');startRun('inf')};
$('modeLong').onclick=()=>{sfx('nope');toast('Run lunga: 6 piani in lavorazione')};
$('modeMonster').onclick=()=>{sfx('nope');toast('Mostro affamato: in lavorazione')};
$('againBtn').onclick=()=>{sfx('click');startRun(S.run)};
$('endMenuBtn').onclick=()=>{sfx('click');showMenu()};
function openPause(fromMenu){if(!fromMenu){if(S.mode!=='build'&&S.mode!=='wave')return;S.prev=S.mode;S.mode='pause';closePanel()}
  $('pauseTitle').textContent=fromMenu?'Impostazioni':'Pausa';$('pauseRun').hidden=fromMenu;$('resumeBtn').textContent=fromMenu?'Chiudi':'Riprendi';$('pause').dataset.menu=fromMenu?'1':'';$('pause').hidden=false;applyVol()}
$('pauseBtn').onclick=()=>{sfx('click');openPause(false)};
$('settingsBtn').onclick=()=>{sfx('click');$('menu').hidden=true;openPause(true)};
$('resumeBtn').onclick=()=>{sfx('click');$('pause').hidden=true;if($('pause').dataset.menu){$('menu').hidden=false}else{S.mode=S.prev||'build'}applyVol()};
$('restartBtn').onclick=()=>{sfx('click');startRun(S.run)};
$('quitBtn').onclick=()=>{sfx('click');showMenu()};
for(const[id,k]of[['volMusic','music'],['volSfx','sfx']]){const el=$(id);el.value=save.vol[k];$(id+'Out').textContent=save.vol[k];
  el.addEventListener('input',()=>{save.vol[k]=+el.value;$(id+'Out').textContent=el.value;applyVol();writeSave();if(k==='sfx')sfx('coin')})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause(false)});
const saveMsg=m=>{$('saveMsg').textContent=m};
$('copySave').onclick=()=>{const code='AB1.'+btoa(unescape(encodeURIComponent(JSON.stringify(save))));const inp=$('saveCode');inp.value=code;
  const done=()=>saveMsg('Codice copiato. Incollalo sull\'altro dispositivo.');
  try{navigator.clipboard.writeText(code).then(done,()=>{inp.select();saveMsg('Codice pronto: selezionalo e copialo.')})}catch(e){inp.select();saveMsg('Codice pronto: selezionalo e copialo.')}};
$('loadSave').onclick=()=>{const v=$('saveCode').value.trim();if(!v.startsWith('AB1.')){saveMsg('Codice non valido. Deve iniziare con AB1.');return}
  try{const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(typeof o.perle!=='number')throw 0;save=Object.assign(JSON.parse(JSON.stringify(DEF_SAVE)),o);save.vol=Object.assign({},DEF_SAVE.vol,o.vol||{});writeSave();
    for(const[id,k]of[['volMusic','music'],['volSfx','sfx']]){$(id).value=save.vol[k];$(id+'Out').textContent=save.vol[k]}applyVol();saveMsg('Salvataggio caricato: '+save.perle+' perle.')}
  catch(e){saveMsg('Codice non valido o rovinato.')}};
$('saveCode').addEventListener('input',()=>saveMsg(''));

/* ================= dimensioni e loop ================= */
function fit(){const a=$('app').getBoundingClientRect();VW=Math.max(1,a.width);VH=Math.max(1,a.height);DPR=Math.min(2,window.devicePixelRatio||1);
  const hudH=$('hud').offsetHeight,barH=$('bar').offsetHeight-14,avail=Math.max(200,VH-hudH-barH);
  SC=Math.min(VW/W,avail/H);OX=(VW-W*SC)/2;OY=hudH+(avail-H*SC)/2;
  V={x0:-OX/SC,y0:-OY/SC,x1:(VW-OX)/SC,y1:(VH-OY)/SC};V.w=V.x1-V.x0;V.h=V.y1-V.y0;
  cv.style.width=VW+'px';cv.style.height=VH+'px';cv.width=Math.ceil(VW*DPR);cv.height=Math.ceil(VH*DPR);
  CAU.width=110;CAU.height=Math.max(20,Math.round(110*V.h/V.w));
  for(const b of snow){b.x=V.x0+Math.random()*V.w;b.y=V.y0+Math.random()*V.h}
  buildBG();if(S.sel)renderTowerPanel();else if(S.selSlot)closePanel()}
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(fit,120)});
const ma=$('menuArt').getContext('2d');
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt*S.speed);render();syncUI();
  if(!$('menu').hidden){ma.setTransform(1,0,0,1,0,0);ma.clearRect(0,0,300,260);ma.setTransform(2,0,0,2,0,0);drawOcto(ma,75,78,1.55,T);drawShark(ma,128,96,.9,-1,T,0);drawCrab(ma,24,100,.85,1,T)}
  requestAnimationFrame(frame)}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
window.abyssView=()=>({OX,OY,SC});window.abyssIcon=(n,pad)=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');const g=x.createRadialGradient(n/2,n*.42,n*.05,n/2,n/2,n*.7);g.addColorStop(0,'#2f6a62');g.addColorStop(1,'#0b1a1c');x.fillStyle=g;x.fillRect(0,0,n,n);const k=n/100*(pad?.78:.9);x.translate(n/2,n/2+n*.06);x.scale(k,k);drawOcto(x,0,0,1.55,.6);return c.toDataURL('image/png')};
genDecor();fit();showMenu();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
